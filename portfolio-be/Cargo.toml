[package]
name = "portfolio-be"
version = "0.1.0"
edition = "2021"

[lib]
name = "be"
path = "src/libs.rs"

[dependencies]
actix-cors = "0.7.1"
actix-web = "4.10.2"
serde = { version = "1.0.219", features = ["derive"] }

chrono = { version = "0.4.40", features = ["serde"] }
dotenv = "0.15.0"
futures-util = "0.3.31"
mongodb = { version = "3.5.2", features = ["rustls-tls"] }
serde_json = "1.0.140"

thiserror = "2.0.18"
