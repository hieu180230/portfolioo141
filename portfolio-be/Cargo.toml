[package]
name = "portfolio-be"
version = "0.1.0"
edition = "2021"

[lib]
name = "be"
path = "src/libs.rs"

[dependencies]
actix-cors = "0.7.1"
actix-web = "4.10.2"
bson = { version = "3.1.0", features = ["chrono-0_4"] }
chrono = { version = "0.4.40", features = ["serde"] }
dotenv = "0.15.0"
futures-util = "0.3.31"
mongodb = { version = "3.5.2", features = ["bson-3", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.18"

[dev-dependencies]
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["mongo"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
